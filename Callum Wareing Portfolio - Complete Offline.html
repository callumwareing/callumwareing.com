  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rem; color: var(--accent); }\n.cs-logo { font-weight: 700; font-size: 0.95rem; letter-spacing: 0.01em; text-decoration: none; color: var(--ink); }\n\n/* ── hero ── */\n.cs-hero { max-width: 900px; margin: 0 auto; padding: 5rem 2.5rem 3rem; }\n.cs-eyebrow { display: inline-flex; align-items: center; gap: 0.6rem; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.02em; color: var(--accent); margin-bottom: 1.5rem; }\n.cs-eyebrow::before { content: ''; width: 22px; height: 1.5px; background: var(--accent); }\n.cs-title { font-size: clamp(2.4rem, 5.5vw, 4rem); font-weight: 700; line-height: 1.0; letter-spacing: -0.02em; margin-bottom: 1.5rem; }\n.cs-lede { font-size: 1.25rem; line-height: 1.6; color: var(--muted); max-width: 660px; font-weight: 400; }\n.cs-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 2rem; }\n.cs-tags span { font-size: 0.65rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; padding: 0.3rem 0.7rem; background: var(--tag-bg); color: var(--muted); border-radius: var(--radius); }\n\n/* ── meta bar (role & timeline) ── */\n.cs-meta { max-width: 900px; margin: 0 auto; padding: 0 2.5rem; }\n.cs-meta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; padding: 2rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }\n.cs-meta-item .label { font-size: 0.7rem; letter-spacing: 0.02em; color: var(--muted); font-weight: 600; margin-bottom: 0.5rem; }\n.cs-meta-item .value { font-size: 0.95rem; font-weight: 500; line-height: 1.4; }\n\n/* ── body sections ── */\n.cs-body { max-width: 900px; margin: 0 auto; padding: 1rem 2.5rem 4rem; }\n.cs-section { padding: 3.5rem 0; border-bottom: 1px solid var(--border); }\n.cs-section:last-child { border-bottom: none; }\n.cs-section-label { font-size: 0.82rem; font-weight: 600; letter-spacing: 0.01em; color: var(--accent); margin-bottom: 1.25rem; }\n.cs-h2 { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.015em; line-height: 1.12; margin-bottom: 3rem; max-width: 640px; }\n.cs-p { font-size: 1.05rem; line-height: 1.8; color: #2c2a25; max-width: 680px; margin-bottom: 1.5rem; font-weight: 400; }\n.cs-section > :last-child { margin-bottom: 0; }\n.cs-p strong { font-weight: 600; color: var(--ink); }\n\n/* lists */\n.cs-list { list-style: none; max-width: 680px; display: flex; flex-direction: column; gap: 1rem; margin: 0 0 1.5rem; }\n.cs-list li { position: relative; padding-left: 1.75rem; font-size: 1.02rem; line-height: 1.65; color: #2c2a25; }\n.cs-list li::before { content: ''; position: absolute; left: 0; top: 0.6em; width: 8px; height: 8px; background: var(--accent); }\n.cs-list li strong { font-weight: 600; color: var(--ink); }\n\n/* process steps */\n.cs-steps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5px; margin: 0 0 1.5rem; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }\n.cs-step { background: var(--card-bg); padding: 1.75rem; }\n.cs-step .num { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 0.75rem; }\n.cs-step h4 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }\n.cs-step p { font-size: 0.9rem; line-height: 1.6; color: var(--muted); }\n\n/* metrics */\n.cs-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin: 0 0 1.5rem; }\n.cs-metric { padding: 2rem 1.75rem; background: var(--accent2); color: var(--paper); border-radius: var(--radius); }\n.cs-metric .big { font-size: 2.8rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1; margin-bottom: 0.6rem; }\n.cs-metric .desc { font-size: 0.85rem; line-height: 1.5; color: #c8d8e8; }\n\n/* pullquote */\n.cs-quote { font-size: 1.6rem; font-weight: 500; line-height: 1.4; letter-spacing: -0.01em; max-width: 700px; margin: 0 0 1.5rem; padding-left: 1.5rem; border-left: 3px solid var(--accent); color: var(--ink); }\n\n/* placeholder note */\n.cs-note { display: inline-block; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; color: var(--accent); border: 1px dashed var(--accent); padding: 0.35rem 0.7rem; border-radius: var(--radius); margin-top: 1.5rem; }\n\n/* footer / close back */\n.cs-foot { background: var(--ink); color: var(--paper); padding: 4.5rem 2.5rem; text-align: center; }\n.cs-foot p { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 1.75rem; color: var(--paper); }\n.cs-foot a.cs-foot-back { display: inline-flex; align-items: center; gap: 0.6rem; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.01em; color: var(--paper); text-decoration: none; border: 1.5px solid rgba(245,242,235,0.4); padding: 0.95rem 1.9rem; border-radius: var(--radius); transition: background 0.2s, color 0.2s; }\n.cs-foot a.cs-foot-back:hover { background: var(--paper); color: var(--ink); }\n\n@media (max-width: 720px) {\n  .cs-meta-grid { grid-template-columns: repeat(2, 1fr); }\n  .cs-steps { grid-template-columns: 1fr; }\n  .cs-metrics { grid-template-columns: 1fr; }\n  .cs-hero, .cs-meta, .cs-body { padding-left: 1.5rem; padding-right: 1.5rem; }\n  .cs-nav { padding: 1rem 1.5rem; }\n  .cs-foot { padding: 3.5rem 1.5rem; }\n}\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"view\" id=\"view-home\">\n\n<nav>\n  <a class=\"nav-logo\" href=\"#\">Callum Wareing<\u002Fa>\n  <ul class=\"nav-links\">\n    <li><a href=\"#work\">Work<\u002Fa><\u002Fli>\n    <li><a href=\"#about\">About<\u002Fa><\u002Fli>\n    <li><a href=\"#contact\">Contact<\u002Fa><\u002Fli>\n  <\u002Ful>\n<\u002Fnav>\n\n<section class=\"hero\">\n  <div>\n    <div class=\"hero-tag\">UX &amp; Product designer · Surrey, UK<\u002Fdiv>\n    <h1>Callum<br>Wareing<em>.<\u002Fem><\u002Fh1>\n    <p class=\"hero-sub\" contenteditable=\"false\">I'm a user experience designer with nearly 3 years of experience working on large scale enterprise products, consistently putting the user first and ensuring our products are <div class=\"proj-tags\"><span>Consumer<\u002Fspan><span>Travel<\u002Fspan><span>Accessibility<\u002Fspan><span>Journey Design<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-arrow\">↗<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"project-card\" onclick=\"showView('cs-3')\">\n      <div class=\"proj-num\">03<\u002Fdiv>\n      <div class=\"proj-body\">\n        <div class=\"proj-title\" contenteditable=\"false\">Barclays mobile app: account creation uplift<\u002Fdiv>\n        <div class=\"proj-type\" contenteditable=\"false\">Personal project · mobile UX · 2024<\u002Fdiv>\n        <div class=\"proj-tags\"><span>Mobile<\u002Fspan><span>Onboarding<\u002Fspan><span>Fintech<\u002Fspan><span>Benchmarking<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-arrow\">↗<\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"skills-section\">\n  <div class=\"section-header\" style=\"padding: 0px 0px 20px; margin: 0px 0px 24px\">\n    <span class=\"section-label\">Core skills<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"skills-grid\" style=\"margin: 0px 0px 24px\">\n    <span class=\"skill-chip\">UX and Interaction Design<\u002Fspan>\n    <span class=\"skill-chip\">Product Thinking<\u002Fspan>\n    <span class=\"skill-chip\">UX Research<\u002Fspan>\n    <span class=\"skill-chip\">Usability Testing<\u002Fspan>\n    <span class=\"skill-chip\">Wireframing and Prototyping<\u002Fspan>\n    <span class=\"skill-chip\">Journey Mapping<\u002Fspan>\n    <span class=\"skill-chip\">Accessibility / WCAG<\u002Fspan>\n    <span class=\"skill-chip\">Agile Delivery<\u002Fspan>\n    <span class=\"skill-chip\">Figma and FigJam<\u002Fspan>\n    <span class=\"skill-chip\">Stakeholder Collaboration<\u002Fspan>\n    <span class=\"skill-chip\">Design Systems<\u002Fspan>\n    <span class=\"skill-chip\">Inclusive Design<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"about-section\" id=\"about\">\n  <div class=\"about-inner\">\n    <div>\n      <div class=\"about-label\"><span style=\"color: #1f6feb\">3 words to describe me:<\u002Fspan><\u002Fdiv>\n      <h2 class=\"about-headline\">Curious,\ninnovative,\nevolving<\u002Fh2>\n      <div class=\"about-label\" style=\"color: rgba(245,242,235,0.5); margin-bottom: 1.25rem;\"><span style=\"color: #1f6feb80\">About me<\u002Fspan><\u002Fdiv>\n      <p class=\"about-body\" contenteditable=\"false\">I'm a UX designer currently working for a leading corporate bank in the UK, getting my hands dirty in the discovery, the early stages of design, the final prototypes and handoff. I believe that every product should be accessible for everyone and I am constantly striving to create new solutions to age-old problems.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"about-pills\">\n      <div class=\"about-pill\">\n        <div class=\"pill-icon\">🏦<\u002Fdiv>\n        <div class=\"pill-text\">\n          <strong contenteditable=\"false\">UX / Product designer<\u002Fstrong>\n          <span contenteditable=\"false\">Barclays Corporate Bank · Aug 2023 to present<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"about-pill\">\n        <div class=\"pill-icon\">♿<\u002Fdiv>\n        <div class=\"pill-text\">\n          <strong contenteditable=\"false\">Accessibility champion<\u002Fstrong>\n          <span contenteditable=\"false\">WCAG built into everything I hand over<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"about-pill\">\n        <div class=\"pill-icon\">🔍<\u002Fdiv>\n        <div class=\"pill-text\">\n          <strong contenteditable=\"false\">End-to-end designer<\u002Fstrong>\n          <span contenteditable=\"false\">From discovery to handoff, I contribute however I can<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"about-pill\">\n        <div class=\"pill-icon\">📍<\u002Fdiv>\n        <div class=\"pill-text\">\n          <strong contenteditable=\"false\">Based in Surrey, UK<\u002Fstrong>\n          <span contenteditable=\"false\">Open to new opportunities<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"contact-section\" id=\"contact\">\n  <div>\n    <h2 class=\"contact-big\">Got something<span> good?<\u002Fspan><\u002Fh2>\n    <p class=\"contact-sub\" contenteditable=\"false\">Hiring, collaborating, or just want to geek out about UX? I'm always up for a good conversation. Drop me a line.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"contact-links\">\n    <a class=\"contact-link\" href=\"mailto:cwareing331@gmail.com\">cwareing331@gmail.com <span>✉<\u002Fspan><\u002Fa>\n    <a class=\"contact-link\" href=\"https://linkedin.com/in/callum-wareing\" target=\"_blank\">LinkedIn <span>↗<\u002Fspan><\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer>\n  <span>© 2025 Callum Wareing<\u002Fspan>\n  <span>callumwareing.com<\u002Fspan>\n<\u002Ffooter>\n\n<\u002Fdiv><!-- /view-home -->\n\n<section class=\"view\" id=\"view-cs-1\" hidden=\"\">\n<nav class=\"cs-nav\">\n  <a class=\"cs-back\" href=\"#\" onclick=\"showView('home','work');return false;\">← Back to work<\u002Fa>\n  <a class=\"cs-logo\" href=\"#\" onclick=\"showView('home');return false;\">Callum Wareing<\u002Fa>\n<\u002Fnav>\n\n<header class=\"cs-hero\" data-screen-label=\"Case study hero\">\n  <div class=\"cs-eyebrow\">Case study 01 · Enterprise UX<\u002Fdiv>\n  <h1 class=\"cs-title\">Corporate banking entitlements redesign<\u002Fh1>\n  <p class=\"cs-lede\">Redesigning a critical entitlements area of a UK corporate bank's platform, the system administrators and clients use to manage user permissions and access rights, and pulling three different eras of design into one consistent, accessible experience.<\u002Fp>\n  <div class=\"cs-tags\">\n    <span>Enterprise<\u002Fspan><span>Research<\u002Fspan><span>Systems Design<\u002Fspan><span>WCAG<\u002Fspan><span>Agile<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"cs-meta\">\n  <div class=\"cs-meta-grid\">\n    <div class=\"cs-meta-item\"><div class=\"label\">My role<\u002Fdiv><div class=\"value\">Lead UX &amp; Product Designer, end to end from research to UI, accessibility and handoff<\u002Fdiv><\u002Fdiv>\n    <div class=\"cs-meta-item\"><div class=\"label\">Timeline<\u002Fdiv><div class=\"value\">Aug 2023 to present<\u002Fdiv><\u002Fdiv>\n    <div class=\"cs-meta-item\"><div class=\"label\">Platform<\u002Fdiv><div class=\"value\">Responsive web (enterprise)<\u002Fdiv><\u002Fdiv>\n    <div class=\"cs-meta-item\"><div class=\"label\">Context<\u002Fdiv><div class=\"value\">Regulated, multi-stakeholder environment<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<main class=\"cs-body\">\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">Overview<\u002Fdiv>\n    <h2 class=\"cs-h2\">Rebuilding the part of the platform that decides who can do what.<\u002Fh2>\n    <p class=\"cs-p\">As an embedded UX and Product Designer at one of the UK's leading corporate banks, I was brought in to redesign a critical entitlements area of the platform: the system through which bank administrators and corporate clients managed user permissions and access rights.<\u002Fp>\n    <p class=\"cs-p\">The area served two distinct groups. Bank administrators used it to manage permissions at the client level, while corporate clients managed the access rights of their own internal teams. Both groups held high-level admin permissions, so the stakes of getting it wrong were high.<\u002Fp>\n    <p class=\"cs-p\">The project sat within a complex, regulated environment with stakeholders across product, engineering, compliance and senior leadership. My role was end to end, from understanding the problem space through to high-fidelity UI, accessibility compliance and developer handoff.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">The problem<\u002Fdiv>\n    <h2 class=\"cs-h2\">Years of patched-up design had piled up, and it showed.<\u002Fh2>\n    <p class=\"cs-p\">Three separate design languages were active within the same area at once, each from a different era of the platform's development. Components, patterns and visual styles changed depending on which part of the area you were in, with nothing tying them together.<\u002Fp>\n    <ul class=\"cs-list\">\n      <li><strong>An inconsistent experience.<\u002Fstrong> Three design languages side by side made every screen feel slightly unfamiliar, even to experienced users.<\u002Fli>\n      <li><strong>Outdated flows.<\u002Fstrong> Older areas reflected how the system had been built, not how people actually thought about their work.<\u002Fli>\n      <li><strong>Poor forms and tables.<\u002Fstrong> Forms were hard to complete and dense tables were difficult to parse.<\u002Fli>\n      <li><strong>Accessibility gaps.<\u002Fstrong> The experience fell well short of modern WCAG standards, a serious issue in a regulated environment where inclusive design is not optional.<\u002Fli>\n    <\u002Ful>\n    <p class=\"cs-p\">The result was an area that felt uncertain and unclear to use. People were doing critical permission work in an interface that made those tasks harder than they needed to be.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">Research and insights<\u002Fdiv>\n    <h2 class=\"cs-h2\">I sat in on testing and watched where people got stuck.<\u002Fh2>\n    <p class=\"cs-p\">The bank's external research team ran usability testing sessions with real users, which I attended and observed closely. I took detailed notes throughout, paying particular attention to moments of hesitation, confusion or error, the places where the interface was working against the user rather than with them.<\u002Fp>\n    <p class=\"cs-quote\">\n<\u002Fp>\n    <p class=\"cs-p\">Those sessions shaped the work directly. The pain points users ran into fed straight into my design decisions, setting both the priorities for the redesign and the specific solutions I tried. Alongside the testing, I went through the existing flows myself to find more issues to fix.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">Process and approach<\u002Fdiv>\n    <h2 class=\"cs-h2\">Turning the findings into work that actually shipped.<\u002Fh2>\n    <p class=\"cs-p\">With the research pulled together into clear priorities, I started redesigning, working in the team's agile cycle. The work came down to four things.<\u002Fp>\n    <div class=\"cs-steps\">\n      <div class=\"cs-step\"><div class=\"num\">01<\u002Fdiv><h4>Unified the design language<\u002Fh4><p>Brought the older areas up to the modern design language so the whole area read as one coherent system.<\u002Fp><\u002Fdiv>\n      <div class=\"cs-step\"><div class=\"num\">02<\u002Fdiv><h4>Streamlined the flows<\u002Fh4><p>Cut steps, consolidated screens that had been split unnecessarily, and simplified fields where complexity had crept in.<\u002Fp><\u002Fdiv>\n      <div class=\"cs-step\"><div class=\"num\">03<\u002Fdiv><h4>Reworked forms and tables<\u002Fh4><p>Overhauled the form design and table patterns throughout, so critical tasks were clearer and faster to complete.<\u002Fp><\u002Fdiv>\n      <div class=\"cs-step\"><div class=\"num\">04<\u002Fdiv><h4>Embedded accessibility<\u002Fh4><p>Built WCAG in at component level, contrast, focus, labelling, errors and screen readers, and championed it in design reviews.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"cs-p\">All design work was produced in Figma, maintained in line with the evolving design system, and handed to engineering with detailed documentation. I stayed closely involved during implementation to make sure the quality carried through to the built product.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">Outcome and impact<\u002Fdiv>\n    <h2 class=\"cs-h2\">One consistent area that people could actually trust.<\u002Fh2>\n    <div class=\"cs-metrics\">\n      <div class=\"cs-metric\"><div class=\"big\">3 → 1<\u002Fdiv><div class=\"desc\">Three legacy design languages pulled into one consistent system<\u002Fdiv><\u002Fdiv>\n      <div class=\"cs-metric\"><div class=\"big\">AA<\u002Fdiv><div class=\"desc\">Redesigned areas brought in line with modern WCAG standards<\u002Fdiv><\u002Fdiv>\n      <div class=\"cs-metric\"><div class=\"big\">↓<\u002Fdiv><div class=\"desc\">Drop-off across key flows fell after the redesign<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"cs-p\">The redesign was a clear step up for both groups. Drop-off across key flows fell, bank users responded well to the new designs, and pulling the three design languages together brought back the consistency and confidence the area had been missing.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">Reflections<\u002Fdiv>\n    <h2 class=\"cs-h2\">What enterprise UX really looks like.<\u002Fh2>\n    <p class=\"cs-p\">This project was a lesson in what real enterprise UX looks like. It is rarely clean, rarely fast and rarely simple. You are designing within constraints, legacy systems, competing stakeholder priorities, regulatory requirements, and the work is as much about navigating those constraints intelligently as it is about the design itself.<\u002Fp>\n    <p class=\"cs-p\">The thing I would change is the research. The usability testing was valuable, but time constraints meant we couldn't go as deep as I would have liked. With more time, I would have invested in more rounds across a broader range of users, particularly to explore how different corporate clients experienced the permission flows depending on the size and complexity of their organisations.<\u002Fp>\n    <p class=\"cs-p\">The experience made me a better designer precisely because it was hard. Designing for a regulated, high-stakes environment teaches you to be rigorous, to ask better questions, and to fight for the user even when other voices in the room are loud.<\u002Fp>\n  <\u002Fsection>\n\n<\u002Fmain>\n\n<footer class=\"cs-foot\">\n  <p>That's the story of this one.<\u002Fp>\n  <a class=\"cs-foot-back\" href=\"#\" onclick=\"showView('home','work');return false;\">← Back to all work<\u002Fa>\n<\u002Ffooter>\n<\u002Fsection>\n\n<section class=\"view\" id=\"view-cs-2\" hidden=\"\">\n<nav class=\"cs-nav\">\n  <a class=\"cs-back\" href=\"#\" onclick=\"showView('home','work');return false;\">← Back to work<\u002Fa>\n  <a class=\"cs-logo\" href=\"#\" onclick=\"showView('home');return false;\">Callum Wareing<\u002Fa>\n<\u002Fnav>\n\n<header class=\"cs-hero\" data-screen-label=\"Case study hero\">\n  <div class=\"cs-eyebrow\">Case study 02 · Consumer UX<\u002Fdiv>\n  <h1 class=\"cs-title\">Airline booking journey redesign<\u002Fh1>\n  <p class=\"cs-lede\">A full audit and redesign of a UK budget airline's booking flow, stripping out the dark patterns while keeping every honest way for the airline to earn more. A personal project, no brief and no constraints.<\u002Fp>\n  <div class=\"cs-tags\">\n    <span>Consumer<\u002Fspan><span>Travel<\u002Fspan><span>Ethical design<\u002Fspan><span>UX audit<\u002Fspan><span>Benchmarking<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"cs-meta\">\n  <div class=\"cs-meta-grid\">\n    <div class=\"cs-meta-item\"><div class=\"label\">My role<\u002Fdiv><div class=\"value\">Solo UX Designer, audit through to high-fidelity redesign<\u002Fdiv><\u002Fdiv>\n    <div class=\"cs-meta-item\"><div class=\"label\">Timeline<\u002Fdiv><div class=\"value\">6 weeks · 2024<\u002Fdiv><\u002Fdiv>\n    <div class=\"cs-meta-item\"><div class=\"label\">Platform<\u002Fdiv><div class=\"value\">Responsive web<\u002Fdiv><\u002Fdiv>\n    <div class=\"cs-meta-item\"><div class=\"label\">Type<\u002Fdiv><div class=\"value\">Personal project<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<main class=\"cs-body\">\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">Overview<\u002Fdiv>\n    <h2 class=\"cs-h2\">A budget airline booking flow, redesigned out of pure frustration.<\u002Fh2>\n    <p class=\"cs-p\">This was a personal project born out of genuine frustration. As a frequent user of budget airline booking journeys, I kept getting tripped up by the same things: hidden costs appearing late in the flow, interfaces clearly built to extract more money rather than help me book, and a seat selection experience that felt deliberately confusing. So I decided to do something about it.<\u002Fp>\n    <p class=\"cs-p\">The project was a full UX audit and redesign of a leading UK budget airline's booking journey, covering every stage from flight selection through to payment. No brief, no stakeholders, no constraints, just a real problem and the freedom to solve it properly.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">The problem<\u002Fdiv>\n    <h2 class=\"cs-h2\">Budget airline booking is full of tricks. This one was no exception.<\u002Fh2>\n    <p class=\"cs-p\">Budget airline booking journeys are some of the most ethically compromised experiences in consumer tech, and the one I audited was no exception. The flow was riddled with dark patterns, design decisions clearly made to serve the business at the direct expense of the user.<\u002Fp>\n    <ul class=\"cs-list\">\n      <li><strong>Hidden fees.<\u002Fstrong> Extra costs appeared late in checkout, by which point people had already sunk time in and were less likely to walk away.<\u002Fli>\n      <li><strong>Misleading upsells.<\u002Fstrong> Seats, bags and extras were presented with layouts and buttons built to make opting in feel like the default.<\u002Fli>\n      <li><strong>Confusing seat selection.<\u002Fstrong> The seat map was muddled enough that people regularly made choices they didn't mean to.<\u002Fli>\n    <\u002Ful>\n    <p class=\"cs-p\">The irony is that dark patterns are bad business as well as bad design. They damage trust, push up abandonment, and send people to a competitor next time. There was a better way to do this.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">Research and insights<\u002Fdiv>\n    <h2 class=\"cs-h2\">Before opening Figma, I went through the whole thing in forensic detail.<\u002Fh2>\n    <p class=\"cs-p\">I started with discovery, working through the existing journey step by step and documenting every friction point, every dark pattern, and every moment the interface felt like it was working against me rather than with me.<\u002Fp>\n    <p class=\"cs-p\">Then I benchmarked the experience across three market segments: other low-cost carriers, mid-market airlines, and luxury carriers. Each had a different relationship with upselling and transparency, and comparing them turned up genuinely useful patterns. The luxury end especially had a lot to teach about presenting extras in a way that feels generous rather than pushy.<\u002Fp>\n    <p class=\"cs-quote\">\n<\u002Fp>\n    <p class=\"cs-p\">That was the insight that shaped everything. You can absolutely give people the chance to add bags, pick seats and upgrade. The people who feel respected are the ones more likely to convert, not less.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">Process and approach<\u002Fdiv>\n    <h2 class=\"cs-h2\">Sketch first, throw plenty away, then build the fidelity up.<\u002Fh2>\n    <p class=\"cs-p\">I worked the whole journey from rough idea to high fidelity, keeping the benchmarking close the whole way through.<\u002Fp>\n    <div class=\"cs-steps\">\n      <div class=\"cs-step\"><div class=\"num\">01<\u002Fdiv><h4>Sketched the journey<\u002Fh4><p>Explored the structure at low fidelity first, so I could move fast and throw things away without the sunk cost of polished screens.<\u002Fp><\u002Fdiv>\n      <div class=\"cs-step\"><div class=\"num\">02<\u002Fdiv><h4>Built up wireframes<\u002Fh4><p>Moved from low-fi wireframes to higher fidelity as the big decisions got locked in.<\u002Fp><\u002Fdiv>\n      <div class=\"cs-step\"><div class=\"num\">03<\u002Fdiv><h4>Iterated each stage<\u002Fh4><p>Flight selection, seat map, extras and checkout each went through several rounds as I refined the flow and tested edge cases.<\u002Fp><\u002Fdiv>\n      <div class=\"cs-step\"><div class=\"num\">04<\u002Fdiv><h4>Checked the benchmarks<\u002Fh4><p>Kept comparing decisions to what worked in other markets, making deliberate calls on where to borrow and where to do something different.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">Outcome and impact<\u002Fdiv>\n    <h2 class=\"cs-h2\">Every dark pattern gone, every honest upsell kept.<\u002Fh2>\n    <p class=\"cs-p\">The redesigned journey stripped out every dark pattern in the original flow while keeping every legitimate upsell. The difference was in how those opportunities were presented: honestly, clearly, and at moments that made sense for the user rather than moments designed to catch them out.<\u002Fp>\n    <div class=\"cs-metrics\">\n      <div class=\"cs-metric\"><div class=\"big\">0<\u002Fdiv><div class=\"desc\">Dark patterns left in the redesigned flow<\u002Fdiv><\u002Fdiv>\n      <div class=\"cs-metric\"><div class=\"big\">Up front<\u002Fdiv><div class=\"desc\">Fees shown early and honestly, not sprung at checkout<\u002Fdiv><\u002Fdiv>\n      <div class=\"cs-metric\"><div class=\"big\">Clear<\u002Fdiv><div class=\"desc\">Seat selection rebuilt so the right choice is obvious<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"cs-p\">Bags, extras and upgrades were presented with straightforward buttons and honest pricing. No pre-ticked boxes, no misleading defaults. The result was a journey that respects the person booking while still giving the airline every chance to grow revenue the right way, through an experience people would actually want to come back to.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">Reflections<\u002Fdiv>\n    <h2 class=\"cs-h2\">What a brief-free project taught me.<\u002Fh2>\n    <p class=\"cs-p\">Working without a brief, a team or a deadline taught me something I now take into every project: discovery has to be thorough before you touch a single artboard. On a personal project with no one to answer to, it's tempting to jump straight into design. Resisting that and spending real time in the problem first made every decision afterwards sharper and easier to justify.<\u002Fp>\n    <p class=\"cs-p\">It also reinforced that the most interesting UX problems are often ethical ones. Designing a booking journey that's both commercially effective and genuinely honest is harder than copying the dark patterns everyone else uses. But it's more interesting, more rewarding, and better for everyone, the business included.<\u002Fp>\n    <p class=\"cs-p\">If I took this further, I'd validate the redesign with real usability testing and see whether removing the dark patterns actually moved conversion and abandonment. That data would make the case for ethical design in a language businesses listen to.<\u002Fp>\n  <\u002Fsection>\n\n<\u002Fmain>\n\n<footer class=\"cs-foot\">\n  <p>That's the story of this one.<\u002Fp>\n  <a class=\"cs-foot-back\" href=\"#\" onclick=\"showView('home','work');return false;\">← Back to all work<\u002Fa>\n<\u002Ffooter>\n<\u002Fsection>\n\n<section class=\"view\" id=\"view-cs-3\" hidden=\"\">\n<nav class=\"cs-nav\">\n  <a class=\"cs-back\" href=\"#\" onclick=\"showView('home','work');return false;\">← Back to work<\u002Fa>\n  <a class=\"cs-logo\" href=\"#\" onclick=\"showView('home');return false;\">Callum Wareing<\u002Fa>\n<\u002Fnav>\n\n<header class=\"cs-hero\" data-screen-label=\"Case study hero\">\n  <div class=\"cs-eyebrow\">Case study 03 · Mobile UX<\u002Fdiv>\n  <h1 class=\"cs-title\">Barclays mobile app: account creation uplift<\u002Fh1>\n  <p class=\"cs-lede\">A benchmarking study, audit and ground-up redesign of a high street bank's account creation journey, cutting a sign-up that ran 4 to 5 minutes slower than every rival down to something that respects the user's time.<\u002Fp>\n  <div class=\"cs-tags\">\n    <span>Onboarding<\u002Fspan><span>Benchmarking<\u002Fspan><span>Account creation<\u002Fspan><span>Mobile<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"cs-meta\">\n  <div class=\"cs-meta-grid\">\n    <div class=\"cs-meta-item\"><div class=\"label\">My role<\u002Fdiv><div class=\"value\">Solo UX Designer, benchmarking, audit and redesign<\u002Fdiv><\u002Fdiv>\n    <div class=\"cs-meta-item\"><div class=\"label\">Timeline<\u002Fdiv><div class=\"value\">4 weeks · 2024<\u002Fdiv><\u002Fdiv>\n    <div class=\"cs-meta-item\"><div class=\"label\">Platform<\u002Fdiv><div class=\"value\">Mobile app<\u002Fdiv><\u002Fdiv>\n    <div class=\"cs-meta-item\"><div class=\"label\">Type<\u002Fdiv><div class=\"value\">Personal project<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<main class=\"cs-body\">\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">Overview<\u002Fdiv>\n    <h2 class=\"cs-h2\">What does a bank actually feel like on day one?<\u002Fh2>\n    <p class=\"cs-p\">This project started with a question I kept coming back to while working on complex enterprise banking systems all day: what does the very first experience of a bank actually feel like for a new customer? I decided to find out by auditing and redesigning the account creation journey for one of the UK's most recognised high street banks, bringing the same rigour from my day job to a consumer product I knew well.<\u002Fp>\n    <p class=\"cs-p\">Working independently with full creative freedom, I ran a benchmarking study across four major banks, audited the existing journey in detail, and rebuilt the account creation flow from the ground up, cutting friction and unnecessary steps and bringing it in line with modern standards and what people now expect.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">The problem<\u002Fdiv>\n    <h2 class=\"cs-h2\">A sign-up that asked far too much, for far too long.<\u002Fh2>\n    <p class=\"cs-p\">The existing journey was built on an outdated design language that hadn't kept pace with the bank's own standards or the wider market. But the look was only part of the problem.<\u002Fp>\n    <ul class=\"cs-list\">\n      <li><strong>Far too long.<\u002Fstrong> Steps that could have been combined were split across separate screens.<\u002Fli>\n      <li><strong>The wrong order.<\u002Fstrong> Information was collected in an order that didn't match how people actually think about signing up.<\u002Fli>\n      <li><strong>Too much asked.<\u002Fstrong> The flow demanded far more of the user than it needed to.<\u002Fli>\n      <li><strong>A wall at documentation.<\u002Fstrong> Drop-off visibly spiked at the documentation step, where people hit a barrier and gave up.<\u002Fli>\n    <\u002Ful>\n    <p class=\"cs-p\">For a bank trying to compete with a new wave of fast, frictionless challengers, a bloated onboarding journey wasn't just a UX problem. It was a competitive one.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">Research and insights<\u002Fdiv>\n    <h2 class=\"cs-h2\">I timed five banks end to end, and the gap was stark.<\u002Fh2>\n    <p class=\"cs-p\">Before designing anything, I benchmarked the journey against four competitors across the whole market: Starling and Revolut from the challenger end, Chase as a digital-native newcomer, and HSBC as a traditional high street comparison.<\u002Fp>\n    <p class=\"cs-quote\">\"Every competitor finished account creation in roughly the same window. The bank I was redesigning took 4 to 5 minutes longer than any of them.\"<\u002Fp>\n    <p class=\"cs-p\">I timed each journey end to end, and the gap really showed, especially in a context where people have zero loyalty and zero patience. The pattern across the best journeys was clear: they collected only what was necessary, asked questions in a logical human order, and got people to the finish line fast. They treated the user's time as something worth respecting. The one I was redesigning didn't.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">Process and approach<\u002Fdiv>\n    <h2 class=\"cs-h2\">Pull it apart, then rebuild it with every screen earning its place.<\u002Fh2>\n    <p class=\"cs-p\">I worked from a full teardown of the existing flow through to resolved high-fidelity designs.<\u002Fp>\n    <div class=\"cs-steps\">\n      <div class=\"cs-step\"><div class=\"num\">01<\u002Fdiv><h4>Pulled the flow apart<\u002Fh4><p>Mapped every step, screen and decision point to see where the length was coming from and where I could condense.<\u002Fp><\u002Fdiv>\n      <div class=\"cs-step\"><div class=\"num\">02<\u002Fdiv><h4>Sketched the structure<\u002Fh4><p>Worked ideas at low fidelity, focused on cutting steps without losing anything genuinely necessary. Every screen had to earn its place.<\u002Fp><\u002Fdiv>\n      <div class=\"cs-step\"><div class=\"num\">03<\u002Fdiv><h4>Built up the fidelity<\u002Fh4><p>Moved from low-fi wireframes to resolved high-fidelity designs, staying close to the bank's design language and accessibility standards.<\u002Fp><\u002Fdiv>\n      <div class=\"cs-step\"><div class=\"num\">04<\u002Fdiv><h4>Fixed the worst step<\u002Fh4><p>Restructured the documentation section, the biggest drop-off, so it felt like a natural part of the journey rather than a sudden wall.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">Outcome and impact<\u002Fdiv>\n    <h2 class=\"cs-h2\">A sign-up that finally respects your time.<\u002Fh2>\n    <p class=\"cs-p\">The redesign cut the overall time to create an account dramatically, bringing it in line with, and in places ahead of, the competitor benchmark. Steps that had been spread across multiple screens were consolidated, and the information was reordered to follow a more natural progression, so the journey felt shorter even where the same details were being collected.<\u002Fp>\n    <div class=\"cs-metrics\">\n      <div class=\"cs-metric\"><div class=\"big\">4–5 min<\u002Fdiv><div class=\"desc\">The gap to rivals the redesign set out to close<\u002Fdiv><\u002Fdiv>\n      <div class=\"cs-metric\"><div class=\"big\">Fewer steps<\u002Fdiv><div class=\"desc\">Screens consolidated where the flow had been split needlessly<\u002Fdiv><\u002Fdiv>\n      <div class=\"cs-metric\"><div class=\"big\">Lower<\u002Fdiv><div class=\"desc\">Documentation step reframed to ease its big drop-off<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"cs-p\">The documentation section was reframed within the flow so it felt like a logical step instead of a barrier. The result was an end-to-end sign-up that respects the user's time, reflects the bank's modern design standards, and holds its own against the best onboarding journeys on the market.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"cs-section\">\n    <div class=\"cs-section-label\">Reflections<\u002Fdiv>\n    <h2 class=\"cs-h2\">Benchmarking, done properly, wins arguments.<\u002Fh2>\n    <p class=\"cs-p\">The biggest thing this taught me was the value of benchmarking done properly. Timing each competitor journey and taking that data seriously, rather than glancing and moving on, gave me a concrete, undeniable case for change that no amount of opinion could argue with. Numbers cut through.<\u002Fp>\n    <p class=\"cs-p\">If I took it further, the next step would be usability testing with real users to validate the structural decisions, followed by deeper discovery to catch any needs I missed working alone. The designs are strong, but a solo project without user validation is a hypothesis, not a conclusion, and I'm honest enough about my process to say so.<\u002Fp>\n    <p class=\"cs-p\">It also reminded me why I got into UX in the first place. Nobody should spend 4 to 5 extra minutes of their life fighting a sign-up form. Good design fixes that. It really is that simple.<\u002Fp>\n  <\u002Fsection>\n\n<\u002Fmain>\n\n<footer class=\"cs-foot\">\n  <p>That's the story of this one.<\u002Fp>\n  <a class=\"cs-foot-back\" href=\"#\" onclick=\"showView('home','work');return false;\">← Back to all work<\u002Fa>\n<\u002Ffooter>\n<\u002Fsection>\n\n<script>\n  function showView(id, anchor){\n    document.querySelectorAll('.view').forEach(function(v){ v.hidden = (v.id !== 'view-' + id); });\n    if (anchor) { var el = document.getElementById(anchor); window.scrollTo(0, el ? Math.max(el.offsetTop - 70, 0) : 0); }\n    else { window.scrollTo(0, 0); }\n  }\n<\u002Fscript>\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
